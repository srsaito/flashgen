server {
    listen 80;
    server_name mcp.ssaito.net;

    # Cloudflare terminates TLS; nginx listens on 80 behind it.
    # Cloudflare proxies HTTPS → HTTP to origin on port 80.
    # Real-IP from Cloudflare:
    real_ip_header CF-Connecting-IP;

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Pass auth header through to the app
        proxy_set_header Authorization $http_authorization;
        # Required for Streamable HTTP (SSE responses can be long-lived)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
