services:
  anki:
    build:
      context: ./anki-headless
    image: flashgen-anki:latest
    container_name: flashgen-anki
    restart: unless-stopped
    # Anki's QtWebEngine (Chromium) needs more than Docker's default 64MB /dev/shm.
    shm_size: "512m"
    volumes:
      # Persist Anki profile, collection, add-ons, and media across restarts
      - anki-data:/root/.local/share/Anki2
    networks:
      - flashgen-net
    # AnkiWeb credentials are mounted as Docker secrets (files under /run/secrets),
    # NOT env vars — so they never appear in `docker inspect` or the container env.
    # The flashgen-sync addon reads them via ANKIWEB_*_FILE. The host secret files
    # live in deploy/secrets/ (gitignored, excluded from the deploy rsync).
    # This container deliberately does NOT load ../.env (it needs none of the
    # MCP-side secrets), so the bearer token and API keys stay out of its env too.
    secrets:
      - ankiweb_username
      - ankiweb_password
    environment:
      ENABLE_VNC: "0"
      ANKIWEB_USERNAME_FILE: /run/secrets/ankiweb_username
      ANKIWEB_PASSWORD_FILE: /run/secrets/ankiweb_password
    # AnkiConnect (port 8765) is NOT published to the host.
    # Other containers on flashgen-net reach it via http://anki:8765.
    #
    # Initial setup (first run only):
    #   docker compose run --rm -e ENABLE_VNC=1 -p 5900:5900 anki
    #   ssh -L 5900:localhost:5900 flashgen-mcp
    #   Connect VNC viewer to localhost:5900, log in to AnkiWeb and sync.
    #   Then start normally: docker compose up -d anki
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -X POST http://localhost:8765
          -H 'Content-Type: application/json'
          -d '{"action":"version","version":6}'
          | grep -q '"result"' || exit 1
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  flashgen-mcp:
    build:
      # Repo root: the Dockerfile installs the project (src/) with uv from here.
      context: ..
      dockerfile: deploy/flashgen-mcp/Dockerfile
    image: flashgen-mcp:latest
    container_name: flashgen-mcp
    restart: unless-stopped
    depends_on:
      anki:
        condition: service_healthy
    # Secrets (FLASHGEN_MCP_TOKEN, OPENAI_API_KEY, GEMINI_API_KEY) come from the
    # repo-root .env — the same file the systemd unit uses. See .env.example.
    env_file:
      - ../.env
    environment:
      # Override .env: reach AnkiConnect over the private compose network.
      ANKI_CONNECT_URL: http://anki:8765
    ports:
      # Published to host loopback only; host cloudflared proxies mcp.ssaito.net here.
      - "127.0.0.1:8000:8000"
    networks:
      - flashgen-net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8000/mcp >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  anki-data:
    driver: local

networks:
  flashgen-net:
    driver: bridge

# File-based secrets (Compose, non-Swarm): each is bind-mounted read-only into
# the service at /run/secrets/<name>. The source files live on the host under
# deploy/secrets/ — create them with `printf %s '<value>' > deploy/secrets/<name>`
# and `chmod 600`. They are gitignored and excluded from the deploy rsync so they
# are never committed and never wiped by a deploy.
secrets:
  ankiweb_username:
    file: ./secrets/ankiweb_username
  ankiweb_password:
    file: ./secrets/ankiweb_password
